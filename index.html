<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#080b10">
  <meta name="description" content="Interactive structural model of a guanosine-capped four-helix bundle with a heme cofactor.">
  <title>Interactive Guanosine-Capped Four-Helix Bundle with Heme Cofactor</title>
  <style>
    :root {
      color-scheme: dark;
      --panel: rgba(8, 11, 16, 0.96);
      --border: rgba(255, 255, 255, 0.13);
      --text: #f4f7fa;
      --muted: #b8c0ca;
      --accent: #8fc8ff;
      --button: rgba(255, 255, 255, 0.07);
      --button-hover: rgba(255, 255, 255, 0.13);
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #000;
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      display: grid;
      grid-template-rows: auto 1fr;
    }

    #infoPanel {
      position: relative;
      z-index: 5;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      padding: 15px 20px;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(12px);
    }

    .titleBlock { min-width: 0; }

    h1 {
      margin: 0;
      font-size: clamp(20px, 2.2vw, 32px);
      line-height: 1.08;
      font-weight: 700;
      letter-spacing: -0.025em;
    }

    .subtitle {
      margin-top: 5px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.35;
    }

    .controls {
      display: flex;
      flex: 0 0 auto;
      gap: 9px;
    }

    .viewButton {
      appearance: none;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 9px 13px;
      background: var(--button);
      color: var(--text);
      font: inherit;
      font-size: 14px;
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
      transition: background 120ms ease, color 120ms ease, border-color 120ms ease;
    }

    .viewButton:hover,
    .viewButton:focus-visible {
      background: var(--button-hover);
      outline: none;
    }

    .viewButton.active {
      color: var(--accent);
      border-color: var(--accent);
    }

    #panelHandle {
      display: none;
    }

    #viewer {
      position: relative;
      width: 100%;
      height: 100%;
      min-height: 0;
      background: #000;
    }

    #status {
      position: absolute;
      z-index: 3;
      left: 16px;
      bottom: 16px;
      max-width: min(680px, calc(100% - 32px));
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--panel);
      color: var(--muted);
      font-size: 13px;
      line-height: 1.4;
      pointer-events: none;
    }

    @media (max-width: 900px) {
      body {
        display: block;
        position: relative;
        height: 100dvh;
        min-height: 100svh;
      }

      #viewer {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }

      #infoPanel {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        flex-direction: column;
        align-items: stretch;
        gap: 9px;
        padding: calc(9px + env(safe-area-inset-top)) 11px 31px;
        border-radius: 0 0 15px 15px;
        box-shadow: 0 10px 28px rgba(0, 0, 0, 0.4);
        transform: translateY(0);
        transition: transform 220ms ease;
        will-change: transform;
      }

      #infoPanel.dragging { transition: none; }

      h1 {
        font-size: 17px;
        line-height: 1.08;
        letter-spacing: -0.018em;
      }

      .subtitle { display: none; }

      .controls {
        gap: 7px;
      }

      .viewButton {
        flex: 1 1 0;
        padding: 8px 8px;
        border-radius: 9px;
        font-size: 13px;
      }

      #panelHandle {
        display: block;
        position: absolute;
        left: 50%;
        bottom: 3px;
        width: 72px;
        height: 26px;
        padding: 0;
        transform: translateX(-50%);
        border: 0;
        border-radius: 999px;
        background: transparent;
        touch-action: none;
        cursor: ns-resize;
      }

      #panelHandle::before {
        content: "";
        display: block;
        width: 40px;
        height: 5px;
        margin: 10px auto 0;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.48);
      }

      #status {
        left: 12px;
        right: 12px;
        bottom: calc(12px + env(safe-area-inset-bottom));
        max-width: none;
      }
    }
  </style>
</head>
<body>
  <header id="infoPanel">
    <div class="titleBlock">
      <h1>Interactive Guanosine-Capped Four-Helix Bundle with Heme Cofactor</h1>
      <div class="subtitle">Four α-helical peptides, a guanosine-based cap, and a central heme cofactor. Drag to rotate. Scroll or pinch to zoom.</div>
    </div>

    <div class="controls" aria-label="Molecular representation controls">
      <button id="atomicBtn" class="viewButton active" type="button">Atomic detail</button>
      <button id="secondaryBtn" class="viewButton" type="button">Secondary structure</button>
    </div>

    <button id="panelHandle" type="button" aria-label="Collapse or expand information panel" aria-expanded="true"></button>
  </header>

  <main id="viewer" aria-label="Interactive 3D molecular viewer">
    <div id="status">Loading interactive molecular model…</div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/ngl@2.4.0/dist/ngl.js"></script>
  <script>
    const stage = new NGL.Stage('viewer', {
      backgroundColor: 'black',
      tooltip: true,
      cameraType: 'orthographic'
    });

    const statusEl = document.getElementById('status');
    const atomicBtn = document.getElementById('atomicBtn');
    const secondaryBtn = document.getElementById('secondaryBtn');
    const infoPanel = document.getElementById('infoPanel');
    const panelHandle = document.getElementById('panelHandle');

    let component = null;
    let panelCollapsed = false;
    let dragStartY = 0;
    let dragStartOffset = 0;
    let currentOffset = 0;

    function setActive(button) {
      atomicBtn.classList.remove('active');
      secondaryBtn.classList.remove('active');
      button.classList.add('active');
    }

    function showAtomicDetail() {
      if (!component) return;
      component.removeAllRepresentations();
      component.addRepresentation('ball+stick', {
        sele: 'all',
        colorScheme: 'element',
        multipleBond: 'symmetric',
        radiusScale: 0.42,
        aspectRatio: 2.0,
        bondSpacing: 0.75
      });
      component.autoView();
      setActive(atomicBtn);
    }

    function showSecondaryStructure() {
      if (!component) return;
      component.removeAllRepresentations();
      component.addRepresentation('cartoon', {
        sele: 'protein',
        color: '#008b8b',
        smoothSheet: true
      });
      component.addRepresentation('ball+stick', {
        sele: 'not protein',
        colorScheme: 'element',
        multipleBond: 'symmetric',
        radiusScale: 0.42,
        aspectRatio: 2.0,
        bondSpacing: 0.75
      });
      component.autoView();
      setActive(secondaryBtn);
    }

    function isMobileLayout() {
      return window.matchMedia('(max-width: 900px)').matches;
    }

    function collapsedOffset() {
      return Math.max(0, infoPanel.offsetHeight - 29);
    }

    function applyPanelOffset(offset, animate = true) {
      if (!isMobileLayout()) {
        currentOffset = 0;
        infoPanel.style.transform = '';
        infoPanel.classList.remove('dragging');
        panelHandle.setAttribute('aria-expanded', 'true');
        return;
      }

      const bounded = Math.min(Math.max(offset, 0), collapsedOffset());
      currentOffset = bounded;
      infoPanel.classList.toggle('dragging', !animate);
      infoPanel.style.transform = `translateY(${-bounded}px)`;
      panelHandle.setAttribute('aria-expanded', String(bounded < collapsedOffset() / 2));
    }

    function setPanelCollapsed(collapsed) {
      panelCollapsed = collapsed;
      infoPanel.classList.remove('dragging');
      applyPanelOffset(collapsed ? collapsedOffset() : 0, true);
    }

    panelHandle.addEventListener('click', () => {
      setPanelCollapsed(!panelCollapsed);
    });

    panelHandle.addEventListener('pointerdown', (event) => {
      if (!isMobileLayout()) return;
      event.preventDefault();
      dragStartY = event.clientY;
      dragStartOffset = currentOffset;
      infoPanel.classList.add('dragging');
      panelHandle.setPointerCapture(event.pointerId);
    });

    panelHandle.addEventListener('pointermove', (event) => {
      if (!panelHandle.hasPointerCapture(event.pointerId)) return;
      const upwardDistance = dragStartY - event.clientY;
      applyPanelOffset(dragStartOffset + upwardDistance, false);
    });

    function finishPanelDrag(event) {
      if (!panelHandle.hasPointerCapture(event.pointerId)) return;
      panelHandle.releasePointerCapture(event.pointerId);
      panelCollapsed = currentOffset > collapsedOffset() * 0.42;
      setPanelCollapsed(panelCollapsed);
    }

    panelHandle.addEventListener('pointerup', finishPanelDrag);
    panelHandle.addEventListener('pointercancel', finishPanelDrag);

    stage.loadFile('guanosine_capped_four_helix_bundle_heme.pdb', { ext: 'pdb' })
      .then((loadedComponent) => {
        component = loadedComponent;
        showAtomicDetail();
        statusEl.textContent = 'Interactive model loaded. Drag to rotate. Scroll or pinch to zoom.';
        setTimeout(() => {
          statusEl.style.transition = 'opacity 450ms ease';
          statusEl.style.opacity = '0';
        }, 2300);
      })
      .catch((error) => {
        console.error(error);
        statusEl.style.color = '#ffd0d0';
        statusEl.textContent = 'The molecular model could not load. Refresh the page and confirm that your internet connection is active.';
      });

    atomicBtn.addEventListener('click', showAtomicDetail);
    secondaryBtn.addEventListener('click', showSecondaryStructure);

    window.addEventListener('resize', () => {
      stage.handleResize();
      applyPanelOffset(panelCollapsed ? collapsedOffset() : 0, true);
    });
  </script>
</body>
</html>
