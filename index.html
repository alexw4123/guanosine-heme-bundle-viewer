  <style>

    * { box-sizing: border-box; }

    header { display: flex; align-items: center; justify-content: space-between; gap: 18px; padding: 17px 22px; background: var(--panel); border-bottom: 1px solid var(--border); backdrop-filter: blur(10px); position: relative; z-index: 2; }
    .title-block { min-width: 0; }
    h1 { margin: 0; font-size: clamp(22px, 2.25vw, 34px); line-height: 1.08; font-weight: 700; letter-spacing: -0.025em; }
    .subtitle { margin-top: 6px; color: var(--muted); font-size: 14px; line-height: 1.4; }
    .controls { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 10px; }
    button { appearance: none; border: 1px solid var(--border); border-radius: 10px; padding: 10px 14px; background: var(--button); color: var(--text); font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; transition: background 120ms ease, color 120ms ease, border-color 120ms ease; }
    button:hover, button:focus-visible { background: var(--button-hover); outline: none; }
    button.active { color: var(--accent); border-color: var(--accent); }
    #viewer { position: relative; width: 100%; height: 100%; background: #000; }
    #status { position: absolute; left: 20px; bottom: 20px; max-width: min(720px, calc(100% - 40px)); padding: 11px 13px; border: 1px solid var(--border); border-radius: 10px; background: var(--panel); color: var(--muted); font-size: 13px; line-height: 1.4; pointer-events: none; z-index: 3; }
    @media (max-width: 900px) { header { flex-direction: column; align-items: flex-start; } .controls { justify-content: flex-start; } }
  </style>
</head>

    function decodeBase64(base64) {
      const binary = atob(base64);
      const bytes = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i += 1) bytes[i] = binary.charCodeAt(i);
      return bytes;
    }

    function setActive(button) {
      secondaryBtn.classList.remove('active');
      atomicBtn.classList.remove('active');
      button.classList.add('active');
    }

    function showAtomicDetail() {
      if (!component) return;
      component.removeAllRepresentations();
      component.addRepresentation('ball+stick', {
        sele: 'all',
        colorScheme: 'element',
        multipleBond: 'symmetric',
        radiusScale: 0.42,
        aspectRatio: 2.0,
        bondSpacing: 0.75
      });
      component.autoView();
      setActive(atomicBtn);
    }

        sele: 'protein',
        color: '#008b8b',
        smoothSheet: true
      });
      component.addRepresentation('ball+stick', {
        sele: 'not protein',
        colorScheme: 'element',
        multipleBond: 'symmetric',
        radiusScale: 0.42,
        aspectRatio: 2.0,
        bondSpacing: 0.75
      });
      component.autoView();
      setActive(secondaryBtn);
    }

    const pdbBlob = new Blob([decodeBase64(pdbBase64)], { type: 'text/plain' });
    const pdbFile = new File([pdbBlob], 'guanosine_capped_four_helix_bundle_heme.pdb', { type: 'text/plain' });

    stage.loadFile(pdbFile, { ext: 'pdb' })
      .then((loadedComponent) => {
        component = loadedComponent;
        showAtomicDetail();
        statusEl.textContent = 'Interactive model loaded. Drag to rotate. Scroll or pinch to zoom.';
        setTimeout(() => {
          statusEl.style.transition = 'opacity 450ms ease';
          statusEl.style.opacity = '0';
        }, 2600);
      })
      .catch((error) => {
        console.error(error);
        statusEl.style.color = '#ffd0d0';
        statusEl.textContent = 'The molecular model could not load. Confirm that your browser has internet access so the NGL molecular viewer library can load.';
      });

    atomicBtn.addEventListener('click', showAtomicDetail);
    secondaryBtn.addEventListener('click', showSecondaryStructure);
    window.addEventListener('resize', () => stage.handleResize());
  </script>
</body>
</html>
